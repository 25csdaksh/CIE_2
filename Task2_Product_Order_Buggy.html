<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Product Order</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
            padding: 32px 16px;
        }

        #mainTitle {
            text-align: center;
            color: darkred;
        }

        #orderBox {
            width: 450px;
            border: 2px solid black;
            margin: 20px auto;
            padding: 20px;
            box-sizing: border-box;
            background-color: white;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 130px;
        }

        input, select {
            padding: 6px;
            box-sizing: border-box;
        }

        .bill {
            width: 450px;
            border: 2px solid green;
            margin: 20px auto;
            padding: 15px;
            box-sizing: border-box;
            background-color: white;
        }

        #orderButton {
            padding: 10px;
            background: lightblue;
            cursor: pointer;
        }

    </style>

</head>

<body>

<h1 id="mainTitle">Online Product Order</h1>

<div id="orderBox">

    <div class="field">

        <label for="customer">Customer Name:</label>

        <input type="text" id="customer">

    </div>

    <div class="field">

        <label for="product">Select Product:</label>

        <select id="product">

            <option value="">Select Product</option>

            <option value="Laptop">Laptop - Rs. 50000</option>

            <option value="Mobile">Mobile - Rs. 20000</option>

            <option value="Keyboard">Keyboard - Rs. 1500</option>

        </select>

    </div>

    <div class="field">

        <label for="quantity">Quantity:</label>

        <input type="text" id="quantity">

    </div>

    <button id="orderButton"
            onclick="calculateBill()">

        Generate Bill

    </button>

</div>

<div id="billBox" class="bill">

    Bill will appear here.

</div>

<script>

function calculateBill() {

    var customer =
        document.getElementById("customer").value.trim();

    var product =
        document.getElementById("product").value;

    var quantity =
        Number(document.getElementById("quantity").value);

    if (customer === "" || product === "" || !Number.isInteger(quantity) || quantity <= 0) {

        alert("Please enter a customer name, select a product, and enter a valid quantity.");
        return;

    }

    var price = 0;

    if (product == "Laptop") {
        price = 50000;
    }

    if (product == "Mobile") {
        price = 20000;
    }

    if (product == "Keyboard") {
        price = 1500;
    }

    var total =
        price * quantity;

    var customerType =
        prompt("Enter Customer Type: Regular or Premium");

    var order =
        confirm("Do you want to place this order?");

    if (order == false) {

        return;

    }

    document.getElementById("billBox").innerHTML =
        "<h2>Order Bill</h2>" +
        "Customer: " + customer +
        "<br>Product: " + product +
        "<br>Price: " + price +
        "<br>Quantity: " + quantity +
        "<br>Total Amount: " + total +
        "<br>Customer Type: " + customerType;

}

</script>

</body>

</html>
